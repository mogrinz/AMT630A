name: Publish v0.7.0 Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.7.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.7.0 --target "${GITHUB_SHA}" --title "AMT630A_OSD v0.7.0" --notes-file GITHUB_RELEASE_NOTES.md
