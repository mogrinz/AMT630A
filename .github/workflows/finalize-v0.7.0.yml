name: Finalize v0.7.0 Tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-v0.7.0.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-time workflow and move v0.7.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-v0.7.0.yml
          git commit -m "Finalize v0.7.0 release"
          git push origin HEAD:main
          git tag -f v0.7.0
          git push origin -f v0.7.0
