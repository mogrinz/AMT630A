name: Repair v0.7.1 source
on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-v0.7.1.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore truncated source and bump patch version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p=Path("src/AMT630A_OSD.cpp")
          s=p.read_text()
          marker="  uint8_t fb06=readReg(DEV_OSD,0x06);"
          assert s.rstrip().endswith(marker), "Source no longer ends at expected truncation point"
          tail=base64.b64decode("").decode()
          p.write_text(s.rstrip()+tail)
          for fn in ["src/AMT630A_OSD.cpp","src/AMT630A_OSD.h"]:
              q=Path(fn); t=q.read_text()
              t=t.replace("Changelog:\nv0.7.0", "Changelog:\nv0.7.1 - 2026-09-29: Restore source file accidentally truncated in v0.7.0.\nv0.7.0",1)
              q.write_text(t)
          q=Path("library.properties"); t=q.read_text().replace("version=0.7.0","version=0.7.1",1); q.write_text(t)
          PY
          rm .github/workflows/repair-v0.7.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AMT630A_OSD.cpp src/AMT630A_OSD.h library.properties .github/workflows/repair-v0.7.1.yml
          git commit -m "Restore truncated source for v0.7.1"
          git push
